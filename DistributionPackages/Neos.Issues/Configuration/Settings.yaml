Neos:
  Flow:
    mvc:
      routes:
        "Neos.Neos":
          variables:
            defaultUriSuffix: ""
    http:
      trustedProxies:
        proxies: "*"
    core:
      subRequestIniEntries:
        memory_limit: 2048M
    persistence:
      backendOptions:
        driver: "%env:NEOS_DB_DRIVER%"
        dbname: "%env:NEOS_DB_NAME%"
        user: "%env:NEOS_DB_USER%"
        password: "%env:NEOS_DB_PASSWORD%"
        host: "%env:NEOS_DB_HOST%"
        port: "%env:NEOS_DB_PORT%"
        charset: "%env:NEOS_DB_CHARSET%"
        defaultTableOptions:
          charset: "%env:NEOS_DB_CHARSET%"
  Neos:
    fusion:
      autoInclude:
        "Neos.Issues": true
    nodeTypes:
      groups:
        neosDevCollection:
          position: 1
          label: "Neos Development Collection"
        flowDevCollection:
          position: 2
          label: "Flow Development Collection"
        neosUI:
          position: 3
          label: "Neos UI"
